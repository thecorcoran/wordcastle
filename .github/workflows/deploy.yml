name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run validate:pack
      - run: npm run build --workspace=packages/core
      - run: npm run build --workspace=apps/spelling -- --base=/spelling/
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/spelling
          cp -r apps/spelling/dist/* _site/spelling/
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=./spelling/">' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
